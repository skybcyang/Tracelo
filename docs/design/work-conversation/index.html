ation:line-through;color:var(--muted)}.op textarea,.op input{width:100%;border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:8px;font-size:13px;margin-top:4px}.op textarea{min-height:90px;resize:vertical}.op footer{border-top:1px solid var(--line);padding:12px 14px;display:flex;justify-content:space-between;gap:6px}.op footer button{font-size:12px}.receipt{font-size:13px;padding:12px 0;border-top:1px solid var(--line);margin-top:14px}.receipt strong{display:block;margin-bottom:6px}.composer{padding:14px 20px 18px;flex:none;border-top:1px solid var(--line);background:var(--surface)}.refs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}.refs:empty{display:none}.ref{font-size:12px;background:var(--soft);border-radius:5px;padding:3px 6px}.ref button{padding:0 4px;margin-left:4px}.inputbox{position:relative;border:1px solid var(--line);border-radius:9px;padding:10px 12px}.inputbox:focus-within{border-color:var(--ink)}.inputbox textarea{width:100%;min-height:66px;max-height:170px;resize:vertical;border:0;outline:none;background:transparent;font-size:13px;display:block;line-height:1.65}.inputbox textarea:focus-visible{outline:none}.sendrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.sendrow button{font-size:12px}.inputhint{font-size:11px;color:var(--muted);margin-top:7px}.picker{position:absolute;bottom:100%;left:0;right:0;background:var(--surface);box-shadow:0 8px 24px #0002;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;max-height:260px;overflow:auto;z-index:5}.picker button{display:block;text-align:left;width:100%;font-size:13px}.picker small{display:block;color:var(--muted);font-size:11px}.history-entry{padding:12px 0 18px 16px;border-left:1px solid var(--line);position:relative}.history-entry:before{content:'';width:6px;height:6px;background:var(--muted);border-radius:50%;position:absolute;left:-3px;top:20px}.history-entry p{font-size:13px;margin:5px 0}.starter{padding-top:30px}.starter h3{font-size:20px;line-height:1.5;margin:0 0 12px}.starter button{border:1px solid var(--line);display:block;width:100%;text-align:left;margin:10px 0;font-size:13px}.mobile-nav{display:none}.history-head{margin-bottom:20px}.history-head h3{font-size:16px;line-height:1.5}.toast{position:fixed;bottom:24px;left:24px;padding:9px 14px;background:var(--accent);color:var(--on);border-radius:8px;font-size:13px;z-index:10}.conversation-list{position:absolute;right:16px;top:55px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px #0002;border-radius:8px;z-index:9;padding:8px;max-width:90%}.conversation-list button{display:block;text-align:left;width:100%}.panel{position:relative}.thinking{color:var(--muted);font-size:13px}.dark{color-scheme:dark;--bg:#202020;--surface:#272727;--ink:#ededeb;--muted:#aaa;--line:#454545;--soft:#353535;--accent:#ededeb;--on:#222}
.card-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.card-heading h3{flex:1}.card-menu{position:relative;flex:none;font-size:12px}.card-menu summary{cursor:pointer;list-style:none;padding:0 4px;color:var(--muted)}.card-menu>div{position:absolute;right:0;top:25px;width:120px;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--surface);z-index:4;box-shadow:0 6px 18px #0002}.card-menu button{display:block;width:100%;text-align:left;font-size:12px}

<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tasks=[{id:'camera',title:'定位相机冷启动耗时',group:'相机研发',tag:'重要且紧急',due:'10月6日',text:'冷启动已经复现，准备采集日志，定位设备初始化阶段的耗时。',todo:'1/3',time:'10:24'}, {id:'metrics',title:'梳理相机性能指标体系',group:'相机研发',tag:'重要不紧急',due:'10月12日',text:'指标清单已补齐，下一步统一首帧、快门响应和保存耗时的定义。',todo:'1/3',time:'昨天'}, {id:'design',title:'确认新版任务录入流程',group:'产品设计',tag:'重要且紧急',due:'10月8日',text:'首次配置提示已核对，正在演练网络失败后恢复输入的路径。',todo:'2/4',time:'11:12'}, {id:'cards',title:'整理卡片信息层级',group:'产品设计',tag:'重要不紧急',due:'10月10日',text:'已对照两种阅读模式，准备统一空状态和长文本的呈现。',todo:'1/3',time:'昨天'}, {id:'review',title:'准备阶段评审材料',group:'项目协作',tag:'重要且紧急',due:'10月6日',text:'交付记录已汇总，正在补充风险责任人与预期解决时间。',todo:'1/3',time:'09:46'}];
let selected='',refs=[],current={messages:[],proposal:null},archive=[],busy=false,epoch=0,timer,historyTask='',oldScroll=0;
const task=id=>tasks.find(t=>t.id===id),message=(kind,text)=>({kind,text});
function board(){for(const [host,list] of [['camera-cards',tasks.filter(t=>t.group==='相机研发')],['other-cards',tasks.filter(t=>t.group!=='相机研发')]]){$(host).previousElementSibling.querySelector('span').textContent=list.length+' 项进行中';$(host).innerHTML=list.map(t=>`<article class="card ${selected===t.id?'selected':''}" id="card-${t.id}"><div class="card-heading"><h3>${esc(t.title)}</h3><details class="card-menu"><summary aria-label="${esc(t.title)}的操作">•••</summary><div><button data-history="${t.id}">查看历史</button><button data-ref="${t.id}">加入对话</button></div></details></div><div class="row"><span class="pill">${esc(t.tag)}</span><span class="small muted">${esc(t.due)}截止</span></div><p class="latest">${esc(t.text)}</p><footer><span>✓ ${t.todo} 项完成</span><span>＋ 记录进展</span></footer></article>`).join('')}document.querySelector('.groups b').textContent='全部 '+tasks.length;const due=tasks.filter(t=>t.due==='10月6日');document.querySelector('.due').innerHTML='<summary>今日截止 · '+due.length+'</summary>'+due.map(t=>`<button data-focus="${t.id}">${esc(t.title)}</button>`).join('')}
function focusTask(id){selected=id;board();$('app').classList.add('show-board');$('show-board').classList.add('active');$('show-chat').classList.remove('active');$('card-'+id)?.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});$('card-'+id)?.classList.add('flash')}
function reference(id){if(!refs.includes(id))refs.push(id);selected=id;board();renderRefs();$('picker').hidden=true;$('input').value=$('input').value.replace(/@[^\s@]*$/,'');showChat();$('input').focus()}
function renderRefs(){$('refs').innerHTML=refs.map(id=>`<span class="ref">@${esc(task(id).title)}<button data-remove="${id}" aria-label="移除引用">×</button></span>`).join('')}
function picker(){const query=$('input').value.match(/@([^\s@]*)$/)?.[1]||'';$('picker').innerHTML=tasks.filter(t=>t.title.includes(query)||t.group.includes(query)).map(t=>`<button data-ref="${t.id}">@ ${esc(t.title)}<small>${esc(t.group)} · 进行中 · ${esc(t.due)}截止</small></button>`).join('')||'<p class="small muted">没有找到匹配的卡片</p>';$('picker').hidden=false}
function render(){if(historyTask)return;const stream=$('stream');stream.innerHTML=current.messages.length?'<div class="topic">今天 · 相机工作整理</div>'+current.messages.map(m=>`<div class="message ${m.kind}">${m.kind==='assistant'?'<div class="byline">Tracelo</div>':''}<p>${esc(m.text).replace(/\n/g,'<br>')}</p></div>`).join(''):`<div class="starter"><h3>把事情想清楚，<br>再向前推进一步。</h3><p class="muted">可以聊想法，也可以 @卡片接着做。</p><button data-prompt="整理一下相机优化的下一步">整理下一步</button><button data-prompt="新建任务：分析相机初始化日志，周五截止">把想法建成任务</button><button id="start-mention">@ 一张卡片，恢复工作上下文</button></div>`;
 if(busy){stream.insertAdjacentHTML('beforeend','<p class="thinking">正在整理… <button id="stop">停止</button></p>');return}
 const p=current.proposal;if(!p)return;
 if(p.applied){stream.insertAdjacentHTML('beforeend',`<div class="receipt"><strong>✓ ${p.type==='create'?'已创建任务':'已更新 '+esc(task(p.target).title)}</strong><span class="muted">${p.type==='create'?'已加入当前看板':'追加 1 条进展 · 截止改为 10月9日'}</span><br><button class="cite" data-focus="${p.target}">查看卡片 →</button></div>`);return}
 stream.insertAdjacentHTML('beforeend',`<section class="op"><header class="op-head"><span>${p.type==='create'?'新建任务':'修改任务'}</span><span class="muted">待你确认</span></header><div class="op-body"><h3>${esc(p.title)}</h3>${p.edit?`<label>任务名称<input id="op-title" value="${esc(p.title)}"></label><label>${p.type==='create'?'待办':'追加进展'}<textarea id="op-text">${esc(p.text)}</textarea></label>`:`<label>${p.type==='create'?'待办':'追加进展'}</label><p>${esc(p.text)}</p>`}<label>截止日期</label><div class="change">${p.type==='create'?'':`<span class="old">${esc(task(p.target).due)}</span><span>→</span>`}<span>2026年10月9日 · 周五</span></div>${p.type==='create'?'<label>相机研发 · 不重要不紧急</label>':''}</div><footer><button id="dismiss-op">不采用</button><div class="row"><button id="edit-op">${p.edit?'完成编辑':'修改内容'}</button><button class="solid" id="apply-op">${p.type==='create'?'确认创建':'确认应用'}</button></div></footer></section>`)
}
function propose(type){current.proposal={type,target:refs[0]||'camera',title:type==='create'?'分析相机初始化日志':task(refs[0]||'camera').title,text:type==='create'?'标注关键初始化阶段；整理耗时对比；确认主要瓶颈。':'日志已采集完成，下一步对比各初始化阶段的耗时。',edit:false,applied:false};render()}
function send(){if(busy||!$('input').value.trim())return;if(current.proposal&&!current.proposal.applied){toast('请先处理当前待确认操作，或点“不采用”后继续讨论');return}const raw=$('input').value.trim(),prefix=refs.map(id=>'@'+task(id).title).join(' ');current.messages.push(message('user',(prefix?prefix+'\n':'')+raw));$('input').value='';busy=true;const token=++epoch;render();timer=setTimeout(()=>{if(token!==epoch)return;busy=false;if(/新建|建成|创建/.test(raw)){current.messages.push(message('assistant','整理为一项任务。截止日期已换成具体日期，你可以修改后再创建。'));propose('create')}else if(refs.length&&/记录|记一下|改到|截止|更新/.test(raw)){current.messages.push(message('assistant','将为这张卡片追加进展，并更新截止日期。其他属性保持不变。'));propose('update')}else{current.proposal=null;current.messages.push(message('assistant','建议先把日志按初始化阶段分开，再对比耗时。先确认主要瓶颈，之后再安排优化与验证。\n这些是下一步建议，还没有写入任务。需要的话，可以把日志分析建成一项任务。'));render()}$('stream').scrollTop=$('stream').scrollHeight},650)}
function history(id){oldScroll=$('stream').scrollTop;historyTask=id;const t=task(id);$('panel-title').textContent='任务历史';$('composer').hidden=true;$('stream').innerHTML=`<button class="border" id="back-chat">← 返回对话</button><div class="history-head"><h3>${esc(t.title)}</h3><span class="small muted">${esc(t.group)} · 进行中</span></div><div class="history-entry"><span class="small muted">今天 ${esc(t.time)} · 进展</span><p>${esc(t.text)}</p></div><div class="history-entry"><span class="small muted">10月5日 14:32 · 进展</span><p>已确认排查范围，保留现场信息，准备继续定位。</p></div><div class="history-entry"><span class="small muted">10月4日 09:10 · 创建任务</span><p>${esc(t.title)}</p></div>`;showChat()}
function back(){historyTask='';$('panel-title').textContent='工作对话';$('composer').hidden=false;render();$('stream').scrollTop=oldScroll}
function showChat(){$('app').classList.remove('show-board');$('show-chat').classList.add('active');$('show-board').classList.remove('active')}
// Keep unfinished input and explicit task references with their conversation.
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.session!==undefined||b.id==='new-chat'){epoch++;clearTimeout(timer);busy=false;current.draft=$('input').value;current.refs=[...refs];if(b.dataset.session!==undefined){const next=archive[Number(b.dataset.session)];$('input').value=next.draft||'';refs=[...(next.refs||[])];renderRefs()}}},true);
function toast(text){$('toast').textContent=text;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,2300)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.ref)reference(b.dataset.ref);if(b.dataset.remove){refs=refs.filter(id=>id!==b.dataset.remove);renderRefs()}if(b.dataset.focus)focusTask(b.dataset.focus);if(b.dataset.history)history(b.dataset.history);if(b.dataset.prompt){$('input').value=b.dataset.prompt;$('input').focus()}if(b.id==='start-mention')picker();if(b.id==='back-chat')back();if(b.id==='stop'){epoch++;clearTimeout(timer);busy=false;current.messages.push(message('assistant','已停止，已发送的内容仍保留。'));render()}if(b.id==='dismiss-op'){current.proposal=null;render()}if(b.id==='edit-op'){const p=current.proposal;if(p.edit){p.title=$('op-title').value;p.text=$('op-text').value}p.edit=!p.edit;render()}if(b.id==='apply-op'){const p=current.proposal;if(p.edit){p.title=$('op-title').value;p.text=$('op-text').value}if(!p.title.trim()||!p.text.trim()){toast('请补全名称与内容');return}if(p.type==='create'){p.target='created-'+Date.now();tasks.push({id:p.target,title:p.title,group:'相机研发',tag:'不重要不紧急',due:'10月9日',text:'尚未记录进展',todo:'0/3',time:'刚刚'})}else{const t=task(p.target);t.title=p.title;t.text=p.text;t.due='10月9日'}p.applied=true;selected=p.target;board();render();$('card-'+p.target)?.classList.add('flash')}if(b.dataset.session){const i=Number(b.dataset.session);[current,archive[i]]=[archive[i],current];historyTask='';$('composer').hidden=false;$('panel-title').textContent='工作对话';$('session-list').hidden=true;render()}});
$('mention').onclick=picker;$('input').oninput=()=>{if(/@[^\s@]*$/.test($('input').value))picker();else $('picker').hidden=true};$('input').onkeydown=e=>{if(e.isComposing)return;if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();send()}if(e.key==='Escape')$('picker').hidden=true};$('send-button').onclick=send;
$('new-chat').onclick=()=>{epoch++;clearTimeout(timer);busy=false;current.draft=$('input').value;archive.unshift(current);current={messages:[],proposal:null};refs=[];renderRefs();$('input').value='';historyTask='';$('composer').hidden=false;$('panel-title').textContent='工作对话';render()};$('sessions').onclick=()=>{$('session-list').innerHTML=archive.length?archive.map((c,i)=>`<button data-session="${i}">${esc(c.messages.find(m=>m.kind==='user')?.text.slice(0,26)||'未命名对话')}</button>`).join(''):'<p class="small muted">当前只有这一段对话</p>';$('session-list').hidden=!$('session-list').hidden};$('theme').onclick=()=>document.body.classList.toggle('dark');$('show-chat').onclick=showChat;$('show-board').onclick=()=>{$('app').classList.add('show-board');$('show-board').classList.add('active');$('show-chat').classList.remove('active')};$('create-top').onclick=()=>{if(historyTask)back();showChat();current.messages.push(message('user','把日志分析建成一项任务，周五截止。'));propose('create')};
const state=new URLSearchParams(location.search).get('state')||'proposal';if(state==='dark')document.body.classList.add('dark');if(state!=='empty'){refs=['camera'];selected='camera';current.messages=[message('user',state==='create'?'把日志分析建成一项任务，周五截止。':'@定位相机冷启动耗时\n日志已经抓完了，记一下进展，截止改到周五。'),message('assistant',state==='create'?'将创建一项任务。未来要做的事情放入待办，不生成初始进展。':'将追加一条进展，并把截止日期改为本周五。原有待办和其他属性保持不变。')];propose(state==='create'?'create':'update');if(state==='done'){const p=current.proposal;p.applied=true;task('camera').text=p.text;task('camera').due='10月9日'}if(state==='history')history('camera')}board();renderRefs();render();if(!historyTask)$('stream').scrollTop=$('stream').scrollHeight;
</script>
</html>
