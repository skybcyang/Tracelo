<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracelo · 顶栏设计预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eae7;color:#30372f;font:13px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,select{font:inherit;color:inherit}button,select{background:#fff;border:1px solid #d2d6d0;border-radius:6px;padding:5px 10px;cursor:pointer}button[aria-pressed=true]{background:#343e36;color:#fff;border-color:#343e36}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #356d54;outline-offset:3px}.review{padding:20px 28px 16px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #d2d6d0;background:#f8f9f6}.review h1{font-size:18px;margin:0 0 3px;font-weight:650;letter-spacing:-.4px}.review p{margin:0;color:#687265;font-size:12px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls label{display:flex;gap:5px;align-items:center;font-size:12px}.sizes{display:flex;gap:4px}.stage{padding:24px 28px 16px;display:flex;justify-content:center}iframe{border:1px solid #cbd1c9;border-radius:9px;width:100%;height:calc(100dvh - 166px);min-height:600px;background:#f1f4f2;box-shadow:0 8px 30px #27362809;transition:width .2s;max-width:100%}.note{max-width:1400px;margin:0 auto;padding:0 28px 18px;display:flex;gap:32px;color:#687265;font-size:12px}.note b{color:#343e36;font-weight:550}.note a{margin-left:auto;color:inherit;white-space:nowrap}@media(max-width:1000px){.review{align-items:flex-start;flex-direction:column;gap:12px}.stage{padding:16px 12px}.note{padding:0 12px 16px;flex-wrap:wrap;gap:6px 16px}}@media(prefers-reduced-motion:reduce){iframe{transition:none}}
</style></head><body>
<header class="review"><div><h1>全局在上，任务在下。</h1><p>顶栏层级调整 · 沿用 A 矿物绿的卡片与时间线，仅设计预览</p></div><div class="controls"><div class="sizes" role="group" aria-label="预览窗口宽度"><button data-width="100%" aria-pressed="true">宽窗口</button><button data-width="960px" aria-pressed="false">分屏</button><button data-width="560px" aria-pressed="false">窄窗口</button></div><select id="theme" aria-label="主题"><option value="evergreen">A 矿物绿</option><option value="graphite">D 石墨紫</option><option value="glacier">E 冰川蓝</option><option value="vermilion">F 暖白朱砂</option></select><label><input type="checkbox" id="many">多分组</label></div></header>
<main class="stage"><iframe id="preview" title="Tracelo 顶栏交互预览" src="preview.html?theme=evergreen&mode=light"></iframe></main>
<footer class="note"><span><b>上层</b>　搜索 / 快捷工具 / 日历 / 系统设置</span><span><b>下层</b>　展示方式 / 分组直达 / 分组管理 / 新建任务</span><a id="direct" href="preview.html?theme=evergreen&mode=light" target="_blank" rel="noopener">单独打开设计稿 ↗</a></footer>
<script>
const frame=document.querySelector('#preview');document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{frame.style.width=b.dataset.width;document.querySelectorAll('[data-width]').forEach(el=>el.setAttribute('aria-pressed',String(el===b)))}));
function update(){const theme=document.querySelector('#theme').value;const url='preview.html?theme='+theme+'&mode='+(theme==='graphite'?'dark':'light')+'&groups='+(document.querySelector('#many').checked?'many':'normal');frame.src=url;document.querySelector('#direct').href=url}document.querySelector('#theme').addEventListener('change',update);document.querySelector('#many').addEventListener('change',update);
</script></body></html>
