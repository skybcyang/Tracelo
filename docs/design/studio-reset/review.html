<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracelo · 完整设计总览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf0ee;color:#29352f;font:14px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}header{padding:48px 4vw 32px;display:flex;align-items:center;justify-content:space-between;gap:24px}h1{margin:0 0 8px;font-size:32px;letter-spacing:-1px;font-weight:600}p{margin:0;color:#69746d}a{color:inherit;text-decoration:none}.button{padding:12px 18px;border-radius:8px;color:white;background:#356a56;white-space:nowrap}.grid{padding:0 4vw 60px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 24px}figure{margin:0;min-width:0}figure img{display:block;width:100%;aspect-ratio:1.6;object-fit:contain;background:#e2e7e3;border:1px solid #d7dfd9;border-radius:12px;box-shadow:0 7px 25px #2b483708}figure a:hover img{border-color:#437d68}figcaption{padding:13px 2px;display:flex;justify-content:space-between;gap:12px}figcaption strong{font-size:14px;font-weight:500}figcaption span{font-size:12px;color:#69746d}.wide{grid-column:1/-1}.mobile-pair{display:flex;justify-content:center;gap:24px;padding:30px;background:#e2e7e3;border-radius:12px}.mobile-pair img{width:auto;max-width:45%;height:620px;aspect-ratio:auto}.mobile-pair a{display:contents}footer{padding:0 4vw 35px;font-size:12px;color:#69746d}a:focus-visible{outline:3px solid #437d68;outline-offset:5px}@media(max-width:760px){header{padding:30px 20px;display:block}header .button{display:inline-block;margin-top:18px}h1{font-size:26px}.grid{padding:0 20px 30px;grid-template-columns:1fr;gap:22px}.mobile-pair{padding:16px;gap:12px}.mobile-pair img{height:auto}figcaption{display:block}figcaption span{display:block;margin-top:4px}}
</style></head><body>
<header><div><h1>Tracelo，重新设计。</h1><p>一套完整的工作台提案。松绿色、中性底色，让任务和记录成为主角。</p></div><a class="button" href="index.html?theme=light">打开交互原型</a></header>
<main class="grid">
<figure class="wide"><a href="index.html?theme=light"><img src="01-workspace-light.png" alt="浅色工作台：分组任务看板与每日时间线"></a><figcaption><strong>工作台 · 浅色</strong><span>导航、任务、时间线，各自清晰，也彼此连接</span></figcaption></figure>
<figure><a href="index.html?theme=dark"><img src="02-workspace-dark.png" alt="深色工作台" loading="lazy"></a><figcaption><strong>工作台 · 深色</strong><span>统一的层次与状态色</span></figcaption></figure>
<figure><a href="index.html?theme=light&amp;view=quadrant"><img src="03-quadrants.png" alt="四象限工作区，四个优先级同屏显示" loading="lazy"></a><figcaption><strong>四象限</strong><span>四个区域同屏，内容各自滚动</span></figcaption></figure>
<figure><a href="index.html?theme=light&amp;screen=detail"><img src="04-task-detail.png" alt="任务详情抽屉与固定进展输入框" loading="lazy"></a><figcaption><strong>任务详情与历史</strong><span>完整上下文，随时追加进展</span></figcaption></figure>
<figure><a href="index.html?theme=light&amp;screen=create"><img src="05-create-task.png" alt="新建任务完整表单" loading="lazy"></a><figcaption><strong>新建任务</strong><span>先记下想法，再补充细节</span></figcaption></figure>
<figure><a href="index.html?theme=light&amp;screen=quick"><img src="06-quick-capture.png" alt="桌面快捷记录窗口" loading="lazy"></a><figcaption><strong>快捷记录</strong><span>接上上次进展，记录眼前这一刻</span></figcaption></figure>
<figure><a href="index.html?theme=light&amp;screen=search"><img src="07-search.png" alt="搜索命中片段与日期" loading="lazy"></a><figcaption><strong>全文搜索</strong><span>从关键词，直接回到一条记录</span></figcaption></figure>
<figure><a href="index.html?theme=light&amp;page=settings"><img src="08-settings.png" alt="工作台设置" loading="lazy"></a><figcaption><strong>设置</strong><span>外观、记录和快捷入口</span></figcaption></figure>
<figure><a href="index.html?theme=light&amp;page=archive"><img src="09-archive.png" alt="已完成与异常关闭任务" loading="lazy"></a><figcaption><strong>已结束任务</strong><span>工作结束，历史继续保留</span></figcaption></figure>
<figure><a href="index.html?theme=light&amp;screen=transfer"><img src="10-transfer.png" alt="导入导出" loading="lazy"></a><figcaption><strong>导入与导出</strong><span>完整带走，预览后导入</span></figcaption></figure>
<figure><a href="index.html?theme=light&amp;screen=groups"><img src="11-groups.png" alt="分组管理" loading="lazy"></a><figcaption><strong>管理分组</strong><span>名称、图标、排序</span></figcaption></figure>
<figure class="wide"><a href="index.html?theme=light&amp;page=timeline"><img src="12-timeline.png" alt="完整每日时间线" loading="lazy"></a><figcaption><strong>每日时间线</strong><span>截止提醒与实际工作记录，在同一时间脉络里</span></figcaption></figure>
<figure class="wide"><div class="mobile-pair"><a href="13-mobile-board.png"><img src="13-mobile-board.png" alt="375像素窄窗口任务视图" loading="lazy"></a><a href="14-mobile-create.png"><img src="14-mobile-create.png" alt="375像素窄窗口新建任务" loading="lazy"></a></div><figcaption><strong>窄窗口</strong><span>单列任务，任务与时间线切换，固定提交按钮</span></figcaption></figure>
</main><footer>设计原型使用虚构示例数据。点击任意设计图进入对应界面；刷新会恢复示例内容。正式插件与真实任务数据未作修改。</footer>
</body></html>
