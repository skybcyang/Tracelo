<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Tracelo · 回到插件尺度</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="host.css"><link rel="stylesheet" href="native.css"><script src="../quick-progress/lucide.min.js"></script></head>
<body class="plugin-design">
  <div class="preview-bar"><div><strong>插件尺度</strong><span>Obsidian 宿主示意 · 示例数据</span></div><div class="preview-options"><label>主题<select id="theme"><option value="dark">深色</option><option value="light">浅色</option></select></label><label class="accent-option">强调色<select id="accent"><option value="violet">宿主紫</option><option value="blue">蓝色</option></select></label><a href="../archives/README.md">设计存档</a></div></div>
  <div class="obsidian-frame">
    <div class="host-titlebar"><span class="traffic" aria-hidden="true"><i></i><i></i><i></i></span><span>工作笔记 · Obsidian</span><span class="host-frame-note">界面原型</span></div>
    <div class="host-body">
      <aside class="host-ribbon" aria-label="宿主工具栏"><button class="host-icon" id="toggle-files" aria-label="收起或展开文件栏" title="收起或展开文件栏"><i data-lucide="panel-left"></i></button><button class="host-icon" data-host="search" aria-label="搜索任务和进展" title="搜索任务和进展"><i data-lucide="search"></i></button><button class="host-icon active" data-host="plugin" aria-label="工作时间线" title="工作时间线"><i data-lucide="history"></i></button><button class="host-icon" data-note="weekly" aria-label="打开周报笔记" title="打开周报笔记"><i data-lucide="file-text"></i></button><span class="ribbon-spacer"></span><button class="host-icon" id="host-settings" aria-label="插件设置" title="插件设置"><i data-lucide="settings"></i></button></aside>
      <aside class="host-files" aria-label="示意文件导航"><div class="file-toolbar"><span>文件</span><i data-lucide="files" aria-hidden="true"></i></div><div class="vault-name"><i data-lucide="chevrons-up-down" aria-hidden="true"></i>工作笔记</div><div class="file-tree"><div class="tree-label"><i data-lucide="chevron-right"></i>收件箱</div><details open><summary><i data-lucide="chevron-down"></i>项目</summary><button data-note="payment"><i data-lucide="file-text"></i>支付模块方案</button><button data-note="onboarding"><i data-lucide="file-text"></i>新用户引导</button></details><details open><summary><i data-lucide="chevron-down"></i>工作记录</summary><button class="selected" data-host="plugin"><i data-lucide="history"></i>工作时间线</button><button data-note="weekly"><i data-lucide="file-text"></i>周报 · 第 40 周</button><div class="tree-label indent"><i data-lucide="chevron-right"></i>任务</div></details><div class="tree-label"><i data-lucide="chevron-right"></i>资料</div></div><div class="vault-foot"><span class="vault-dot"></span>本地知识库</div></aside>
      <section class="host-workspace"><div class="host-tabs"><button class="host-tab active" data-host="plugin"><i data-lucide="history"></i>工作时间线<span aria-hidden="true">×</span></button><button class="host-tab" data-note="weekly"><i data-lucide="file-text"></i>周报 · 第 40 周</button><span class="tab-fill"></span><span class="tab-decoration" aria-hidden="true"><i data-lucide="panel-right"></i></span></div><div class="host-view-header"><span id="host-view-title">工作时间线</span><span id="host-view-subtitle">Tracelo</span></div><div id="plugin-mount" aria-label="Tracelo 插件视图"></div><article id="note-preview" hidden></article></section>
    </div><footer class="host-status"><span id="demo-state">示例工作区 · 刷新恢复</span><span>Tracelo <span id="task-count"></span></span></footer>
  </div>
  <script type="module" src="preview.js"></script>
</body>
</html>
